
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - ExamGuard</title>
</head>

<body>

    <h1>ExamGuard</h1>
    <h2>Student Registration</h2>

    {% if message %}
        <p style="color: green;">{{ message }}</p>
    {% endif %}

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form action="/register" method="POST">

        <label>Username</label><br>
        <input
            type="text"
            name="username"
            minlength="3"
            maxlength="80"
            required
        >
        <br><br>

        <label>Full Name</label><br>
        <input
            type="text"
            name="fullname"
            maxlength="50"
            required
        >
        <br><br>

        <label>Email</label><br>
        <input
            type="email"
            name="email"
            required
        >
        <br><br>

        <label>Password</label><br>
        <input
            type="password"
            name="password"
            minlength="8"
            required
        >
        <br><br>

        <button type="submit">Register</button>

    </form>

</body>
</html>
