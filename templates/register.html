<!-- Jinja fills this HTML page with messages and old form values. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register</title>

    <!-- CSS controls the appearance of the page. -->
    <style>
        body {
            background: #f2f4f7;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
        }

        main {
            background: white;
            border-radius: 8px;
            margin: auto;
            max-width: 420px;
            padding: 25px;
        }

        h1, h2, p {
            text-align: center;
        }

        h1 {
            color: #2563eb;
        }

        label {
            display: block;
            margin-top: 12px;
        }

        input, button {
            box-sizing: border-box;
            font-size: 16px;
            padding: 10px;
            width: 100%;
        }

        input {
            border: 1px solid #aaa;
            margin-top: 5px;
        }

        button {
            background: #2563eb;
            border: 0;
            color: white;
            cursor: pointer;
            margin-top: 20px;
        }

        .message, .error {
            padding: 10px;
        }

        .message {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>
<body>
    <main>
        <h1>ExamGuard</h1>
        <h2>Create account</h2>

        <!-- Show a success message after registration. -->
        {% if message %}
            <p class="message">{{ message }}</p>
        {% endif %}

        <!-- Show a validation error when registration fails. -->
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <!-- Send the form values to the registration route in main.py. -->
        <form action="/register-form" method="post">
            <label for="username">Username</label>
            <input id="username" name="username" type="text"
                   value="{{ form_data.username | default('') }}" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password"
                   minlength="8" required>

            <label for="roll_number">Roll number</label>
            <input id="roll_number" name="roll_number" type="text"
                   value="{{ form_data.roll_number | default('') }}">

            <label for="department">Department</label>
            <input id="department" name="department" type="text"
                   value="{{ form_data.department | default('') }}">

            <label for="programme">Programme</label>
            <input id="programme" name="programme" type="text"
                   value="{{ form_data.programme | default('') }}">

            <label for="semester">Semester</label>
            <input id="semester" name="semester" type="number" min="1"
                   value="{{ form_data.semester | default('') }}">

            <button type="submit">Register</button>
        </form>

        <p><a href="/login">Already have an account? Login</a></p>
    </main>
</body>
</html>
